name: support-service

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ${DB_NAME:-support_service}
      POSTGRES_USER: ${DB_USERNAME:-support_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Заполните DB_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-support-service:local}
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-support_service}
      DB_USERNAME: ${DB_USERNAME:-support_service}
      DB_PASSWORD: ${DB_PASSWORD:?Заполните DB_PASSWORD в .env}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres-data:
